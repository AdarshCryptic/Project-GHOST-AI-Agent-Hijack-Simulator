[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost"
version = "0.1.0"
description = "GHOST — Generative Hijack Observation & Safety Testing. A harmless, sandboxed AI red-team engine."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ghost = "ghost.cli:main"

[tool.setuptools.packages.find]
include = ["ghost*"]
